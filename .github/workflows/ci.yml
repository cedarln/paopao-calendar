name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不跑 android-actions/setup-android：它要装的 `tools` 包在 runner 的
      # cmdline-tools 16.0 里已经被删掉，装不上直接让 job 失败。runner 镜像自带
      # Android SDK 且 licenses 已接受，缺 platform / build-tools 时 AGP 会自己补下载。

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
